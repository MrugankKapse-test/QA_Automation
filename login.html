<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>coreco Style - Login</title>
  <style>
    :root {
      --primary: #ff7b00;
      --primary-hover: #e06d00;
      --bg: #f6f8fb;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .brand-side {
      flex: 1;
      background: linear-gradient(135deg, #ff7b00 0%, #ffae00 100%);
      color: white;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-side h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .brand-side p {
      font-size: 1rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    .form-side {
      flex: 1;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 2rem;
    }

    .form-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .demo-hint {
      background: #fff7ed;
      border: 1px solid #ffedd5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #9a3412;
      margin-bottom: 1.5rem;
    }

    .error-message {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 123, 0, 0.2);
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    @media (max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
      }
      .brand-side {
        padding: 2rem;
      }
      .form-side {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="brand-side">
      <h1>coreco</h1>
      <p>Human Resource Management System Automation Demo Environment.</p>
    </div>

    <div class="form-side">
      <div class="form-header">
        <h2>Login</h2>
      </div>

      <div class="demo-hint">
        <strong>Testing Credentials:</strong><br/>
        Username: <code>Admin</code><br/>
        Password: <code>admin123</code>
      </div>

      <div id="error-box" class="error-message">Invalid Username or Password</div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Username" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Password" 
            required 
          />
        </div>

        <button type="submit" class="btn-login" id="login-btn">Login</button>
      </form>
    </div>
  </div>

  <script>
    const VALID_USERNAME = "Admin";
    const VALID_PASSWORD = "admin123";

    // Redirect to dashboard if already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "home.html";
    }

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("error-box");

      
      // Validate credentials against requested input (Admin / admin123)
      if (usernameInput === VALID_USERNAME && passwordInput === VALID_PASSWORD) {
        errorBox.style.display = "none";
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", usernameInput);
        window.location.href = "home.html";
      } else {
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
