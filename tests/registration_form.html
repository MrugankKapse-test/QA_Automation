<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 2rem; }
    main { background: white; border-radius: 8px; box-shadow: 0 2px 12px #0002; margin: auto; max-width: 520px; padding: 2rem; }
    label, legend { font-weight: 600; }
    input, select { box-sizing: border-box; display: block; margin: .4rem 0 1rem; padding: .6rem; width: 100%; }
    fieldset { border: 0; margin: 0 0 1rem; padding: 0; }
    .choices { display: flex; gap: 1rem; margin-top: .5rem; }
    .choices label { font-weight: normal; }
    .choices input { display: inline; margin: 0 .3rem 0 0; width: auto; }
    button { background: #1769aa; border: 0; border-radius: 4px; color: white; cursor: pointer; padding: .7rem 1.2rem; }
    #message { font-weight: 600; margin-top: 1rem; }
    .success { color: #147a33; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <form id="registration-form" novalidate>
      <label for="first-name">First name</label>
      <input id="first-name" name="firstName" required>

      <label for="last-name">Last name</label>
      <input id="last-name" name="lastName" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" required>

      <fieldset>
        <legend>Gender</legend>
        <div class="choices">
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Hobbies</legend>
        <div class="choices">
          <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
          <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
          <label><input type="checkbox" name="hobbies" value="music"> Music</label>
        </div>
      </fieldset>

      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Choose a country</option>
        <option value="india">India</option>
        <option value="usa">United States</option>
        <option value="uk">United Kingdom</option>
      </select>

      <button type="submit">Register</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector('#registration-form');
    const message = document.querySelector('#message');

    form.addEventListener('submit', event => {
      event.preventDefault();
      const gender = form.querySelector('[name="gender"]:checked');
      const hobbies = form.querySelectorAll('[name="hobbies"]:checked');

      if (!form.checkValidity() || !gender || hobbies.length === 0) {
        message.className = 'error';
        message.textContent = 'Please complete all required fields and choose at least one hobby.';
        return;
      }

      message.className = 'success';
      message.textContent = `Registration successful for ${form.firstName.value} ${form.lastName.value}.`;
    });
  </script>
</body>
</html>
